<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Card</title>
    <style>
        *{
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Comic sans MS', sans-serif;
        }
        .main{
        background:#ffeef5;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        }
        .card{
        background:#fff;
        width: 300px;
        height: 450px;
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        overflow: hidden;
        }
        img{
        width: 150px;
        height: 150px;
        border-radius: 50%;
        margin: 20px auto;
       padding: 20px;
        }
      .card-para{
        width: 300px;
        height: 250px;
        display: flex ;
        justify-content: center;
        flex-direction: column;
        gap: 30px;
      }
        h1{
        color: #eb5873;
        font-size: 24px;
        padding-left:20px;
        }
        p{
        font-size: 16px;
        text-align: center;
        }
        button{
        width: 150px;
        padding: 15px;
        margin-left: 120px;
        font-size: 20px;
        font-family: 'Comic sans MS', sans-serif ;
        color: #fff;
        background-color:#eb5873;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        }
    </style>
</head>
<body>
   <div class="main">
     <div class="card">
    <img src="developerImage.jpg">
       <div class="card-para">
         <h1>💖 Fawadalam 💖</h1>
        <p>Hi' I am Fawadalam  Web Developer <br> & Designer</p>
        <button>Follow</button>
       </div>
    </div>
   </div>
</body>
</html>
